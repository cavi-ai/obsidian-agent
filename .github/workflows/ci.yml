name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Unit tests
        run: node --test 'scripts/**/*.test.mjs'
      - name: Validate capability registry
        run: node scripts/validate-registry.mjs
