name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Unit tests
        run: node --test --test-concurrency=1 'scripts/**/*.test.mjs'
      - name: Eval harness tests
        run: python3 -m unittest discover -s evals/routing -p "test_*.py"
      - name: Validate release identity and documentation
        run: |
          node scripts/validate-release.mjs
          node scripts/docs/build-obsidian-agent.mjs --version 0.1.0 --tag v0.1.0 --commit "$(git rev-parse HEAD)" --source-date-epoch "$(git show -s --format=%ct HEAD)"
          node scripts/docs/verify-obsidian-agent.mjs
      - name: Validate capability registry
        run: node scripts/validate-registry.mjs
      - name: Validate portability
        run: node scripts/validate-portability.mjs
      - name: Validate context budget
        run: node scripts/validate-context-budget.mjs
